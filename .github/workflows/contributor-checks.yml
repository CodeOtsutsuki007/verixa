name: Contributor checks

# Runs only on pull requests, alongside the main CI pipeline.
#
# ## What this is for, and why it is separate from ci.yml
#
# `ci.yml` answers "does the code work". This answers "can a maintainer review
# this, and will the contributor understand what to fix if not".
#
# Those are different jobs. A build failure is unambiguous; a 2,000-line pull
# request that touches nine unrelated things is perfectly green and takes an
# afternoon to review, and the contributor has no idea they have done anything
# wrong. Most of the checks here are therefore **advisory** — they leave a
# comment explaining the problem rather than blocking the merge — because the
# failure mode of a blocking check that a newcomer cannot interpret is that
# they close the pull request and leave.
#
# What blocks: architecture violations and secrets. Those are correctness and
# safety, not style, and both come with an explanation of the fix.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push supersedes the previous run. Contributors iterate, and queueing
# five runs of the same checks helps nobody.
concurrency:
  group: contributor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # Blocking: the architecture rules this codebase actually rests on.
  # ---------------------------------------------------------------------------
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      # Full history: the adapter check below diffs against the base branch,
      # and a shallow clone has no base branch to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The layering rule lives in eslint.config.mjs so it also fires in a
      # contributor's editor, long before CI. Running it as its own job just
      # makes the failure legible: "architecture" failing says something
      # different from "lint" failing.
      - name: Domain and application layers must not import infrastructure
        run: |
          set -eu
          if pnpm lint 2>&1 | tee lint.log | grep -q "must not import infrastructure"; then
            echo "::error::A domain or application file imports infrastructure."
            echo ""
            echo "Domain and application code must not reach for Prisma, Fastify,"
            echo "the Stellar SDK, or anything under infrastructure/."
            echo ""
            echo "A domain entity that imports Prisma cannot be unit-tested without"
            echo "a database, and a use case that imports Fastify cannot be reused"
            echo "outside HTTP. At that point the ports are decoration."
            echo ""
            echo "The fix is almost always: define an interface in"
            echo "application/ports/, depend on that, and let the composition root"
            echo "in apps/api/src/composition-root.ts supply the real thing."
            echo ""
            echo "See docs/guides/domain-modeling.md. Ask on the PR if unsure —"
            echo "this one is genuinely subtle and getting it wrong is normal."
            grep "must not import infrastructure" lint.log || true
            exit 1
          fi
          echo "Layering respected."

      # Adapters are interchangeable only if they are actually tested as such.
      # A new repository implementation that skips the contract suite passes
      # its own tests and then behaves differently in production.
      - name: New repository adapters must run the contract suite
        run: |
          set -eu
          adapters="$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E 'infrastructure/persistence/.*repository\.ts$' \
            | grep -v '\.spec\.ts$' || true)"

          if [ -z "$adapters" ]; then
            echo "No new or changed repository adapters."
            exit 0
          fi

          echo "Changed repository adapters:"
          echo "$adapters"
          echo ""

          if grep -rq "contract" --include="*.spec.ts" packages/*/infrastructure/persistence/ 2>/dev/null; then
            echo "Contract suites are present."
          else
            echo "::warning::Changed a repository adapter without a contract test in sight."
            echo "Every adapter should pass the shared contract suite — see"
            echo "packages/identity/infrastructure/testing/contracts/."
          fi

  # ---------------------------------------------------------------------------
  # Blocking: secrets. Cheap to check, expensive to get wrong.
  # ---------------------------------------------------------------------------
  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the diff for credentials
        run: |
          set -eu
          diff="$(git diff origin/${{ github.base_ref }}...HEAD -- . \
            ':(exclude).github/workflows/*' || true)"

          # Deliberately narrow. A scanner that fires on every base64 string
          # gets ignored within a week, and an ignored scanner is worse than
          # none because it produces the feeling of coverage.
          if printf '%s' "$diff" | grep -nE '^\+.*(SECRET_KEY|PRIVATE_KEY|-----BEGIN [A-Z ]*PRIVATE KEY-----)[^A-Z_]*[=:][[:space:]]*["'"'"'][^"'"'"']{16,}' ; then
            echo "::error::What looks like a real secret is being committed."
            echo "Use an environment variable and document it in .env.example."
            exit 1
          fi

          # Stellar secret keys have a distinctive shape: S + 55 base32 chars.
          if printf '%s' "$diff" | grep -nE '^\+.*\bS[A-Z2-7]{55}\b'; then
            echo "::error::That looks like a Stellar secret key."
            echo "Never commit one, even for testnet — throwaway keys get reused."
            exit 1
          fi

          echo "No secrets detected."

  # ---------------------------------------------------------------------------
  # Advisory: reviewability. Comments rather than blocks.
  # ---------------------------------------------------------------------------
  reviewability:
    name: Pull request shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assess size and scope
        id: assess
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"
          files="$(git diff --name-only "$base"...HEAD | wc -l | tr -d ' ')"
          # Lockfiles and generated output dominate the count without costing
          # review effort, so they are excluded from the signal.
          added="$(git diff --numstat "$base"...HEAD \
            -- . ':(exclude)pnpm-lock.yaml' ':(exclude)**/dist/**' \
            | awk '{ sum += $1 } END { print sum + 0 }')"
          packages="$(git diff --name-only "$base"...HEAD \
            | grep -oE '^(packages/[a-z-]+|apps/[a-z-]+)' | sort -u | wc -l | tr -d ' ')"

          echo "files=$files"    >> "$GITHUB_OUTPUT"
          echo "added=$added"    >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

          echo "Files changed: $files"
          echo "Lines added (excluding lockfile and dist): $added"
          echo "Packages touched: $packages"

      - name: Check the description explains why
        id: description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          words="$(printf '%s' "$BODY" | wc -w | tr -d ' ')"
          echo "words=$words" >> "$GITHUB_OUTPUT"
          echo "Description length: $words words"

      - name: Comment when the shape makes review hard
        if: >-
          steps.assess.outputs.added > 600 ||
          steps.assess.outputs.packages > 2 ||
          steps.description.outputs.words < 15
        # Fork PR tokens may not have comment permissions even when the
        # workflow requests them. Reviewability is advisory, so that must not
        # turn the check red.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const added = Number('${{ steps.assess.outputs.added }}');
            const packages = Number('${{ steps.assess.outputs.packages }}');
            const words = Number('${{ steps.description.outputs.words }}');

            const notes = [];
            if (added > 600) {
              notes.push(
                `**This is a large change** — ${added} lines added. Large pull ` +
                `requests get reviewed slowly, not because anyone is unwilling ` +
                `but because finding the important part takes an afternoon. If ` +
                `it splits cleanly along the roadmap issues, several small PRs ` +
                `will merge faster than one big one. If it genuinely does not ` +
                `split, say so and we will work through it.`
              );
            }
            if (packages > 2) {
              notes.push(
                `**This touches ${packages} packages.** That is sometimes ` +
                `correct — a port and its adapter live in different places — ` +
                `but it is also how unrelated work ends up bundled together. ` +
                `Worth a sentence in the description saying why each one had ` +
                `to change.`
              );
            }
            if (words < 15) {
              notes.push(
                `**The description is very short.** A reviewer can read the ` +
                `diff; what they cannot read is *why* you made a particular ` +
                `choice, or what you tried first. Even two sentences on the ` +
                `reasoning makes a review faster and the merged history more ` +
                `useful to whoever reads it in a year.`
              );
            }

            const body = [
              `### A few notes on reviewability`,
              ``,
              `These are **advisory** — nothing here blocks the merge, and none ` +
              `of it means the code is wrong.`,
              ``,
              ...notes.map((n) => `- ${n}`),
              ``,
              `---`,
              `<sub>Automated. Disagree? Say so on the PR — these heuristics are ` +
              `wrong often enough that pushing back is expected.</sub>`,
            ].join('\n');

            const marker = '### A few notes on reviewability';
            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = existing.data.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            // Updated in place rather than appended, so a contributor who
            // pushes six times does not accumulate six identical comments.
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ---------------------------------------------------------------------------
  # Advisory: did new behaviour arrive with tests?
  # ---------------------------------------------------------------------------
  test-coverage:
    name: New code has tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare source and test changes
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"

          src="$(git diff --name-only "$base"...HEAD \
            | grep -E '^(packages|apps)/.*\.ts$' \
            | grep -v '\.spec\.ts$' \
            | grep -v '/testing/' || true)"
          tests="$(git diff --name-only "$base"...HEAD | grep -E '\.spec\.ts$' || true)"

          if [ -z "$src" ]; then
            echo "No source changes — nothing to check."
            exit 0
          fi

          if [ -n "$tests" ]; then
            echo "Source and tests both changed."
            exit 0
          fi

          echo "::warning::Source files changed but no test file did."
          echo ""
          echo "Changed without accompanying tests:"
          echo "$src"
          echo ""
          echo "This is a warning, not a failure — a pure refactor or a docs-only"
          echo "type change legitimately needs no new test. But if this adds or"
          echo "changes behaviour, it needs a test that would fail without it."
          echo ""
          echo "Not sure where it goes? Unit tests sit next to the code they"
          echo "cover; anything needing a database lives in tests/integration/."

  # ---------------------------------------------------------------------------
  # Dependency review on anything touching the lockfile.
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect lockfile changes
        id: lock
        run: |
          set -eu
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q 'pnpm-lock.yaml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.lock.outputs.changed == 'true'
      - uses: actions/setup-node@v4
        if: steps.lock.outputs.changed == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Audit for known vulnerabilities
        if: steps.lock.outputs.changed == 'true'
        run: |
          set -eu
          pnpm install --frozen-lockfile
          # High and critical only. A build that fails on every low-severity
          # advisory in a transitive dev dependency gets bypassed habitually,
          # and a bypassed gate protects nothing.
          if ! pnpm audit --audit-level high; then
            echo "::error::A high or critical severity advisory affects this dependency change."
            echo "Options, roughly in order of preference: upgrade the dependency,"
            echo "remove it, or add a pinned override in pnpm-workspace.yaml with a"
            echo "comment explaining the decision — there are existing examples there."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Welcome first-time contributors.
  # ---------------------------------------------------------------------------
  welcome:
    name: First-time contributor
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const author = context.payload.pull_request.user.login;
            const theirs = pulls.filter((p) => p.user.login === author);
            if (theirs.length > 1) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `Thanks for your first pull request to Verixa.`,
                ``,
                `A few things worth knowing, so nothing here surprises you:`,
                ``,
                `- **Some checks are advisory.** Only architecture boundaries and`,
                `  secret detection block a merge. Everything else leaves a comment`,
                `  you are free to disagree with.`,
                `- **CI failures are normal**, especially the commit-message format`,
                `  and the layering rule. Neither means the work is wrong.`,
                `- **Ask on the PR.** Questions are not a sign you should not be`,
                `  working on this. The parts of this codebase that are subtle are`,
                `  subtle for everyone.`,
                ``,
                `If anything in the issue you picked up was unclear or wrong, saying`,
                `so is a genuinely useful contribution by itself.`,
              ].join('\n'),
            });
